:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}

/* Layout: sticky signage-style header + scrolling tab bar, one working column (max 760px) that stacks on phones.
   Palette: concrete neutrals with a hi-vis orange accent. Type: Barlow Condensed signage display, Barlow body, Plex Mono for dates and numbers. */
:root{
  --bg:#FFFFFF; --surface:#F7F9F8; --raised:#FFFFFF; --ink:#26302D; --muted:#6B7772; --line:#E8ECEA; --sel:#EAF3F5; color-scheme:light;
  --accent:#C8530F; --accent-ink:#FFFFFF; --accent-soft:#FBE8DA; --ok:#2F8556; --ok-soft:#DFF1E6; --danger:#A52A2A;
  --steel:#3F6B7A; --steel-ink:#FFFFFF;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root[data-theme="auto"]{--bg:#141A19; --surface:#1B2321; --raised:#222B29; --ink:#E6ECEA; --muted:#98A5A0; --line:#2F3B38; --sel:#26363A; --accent:#F08A4B; --accent-ink:#1B0F06; --accent-soft:#3A2619; --ok:#6CC28C; --ok-soft:#1F3A2A; --danger:#FF8A80; --steel:#355B69; --steel-ink:#EAF0EE; color-scheme:dark;}:root[data-theme="auto"] .box{border-color:var(--muted)}}
:root[data-theme="dark"]{--bg:#141A19; --surface:#1B2321; --raised:#222B29; --ink:#E6ECEA; --muted:#98A5A0; --line:#2F3B38; --sel:#26363A; --accent:#F08A4B; --accent-ink:#1B0F06; --accent-soft:#3A2619; --ok:#6CC28C; --ok-soft:#1F3A2A; --danger:#FF8A80; --steel:#355B69; --steel-ink:#EAF0EE; color-scheme:dark;}
:root[data-theme="dark"] .box{border-color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--raised);padding:10px 18px;min-height:44px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sel);box-shadow:inset 0 -3px 0 var(--accent)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-body);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:2.5rem;line-height:1.1} h2{font-size:1.45rem;line-height:1.2} h3{font-size:1.05rem;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem}

/* app shell: left page list, one white page column */
.app{display:flex;min-height:100vh}
.side{flex:0 0 264px;width:264px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:14px;padding:14px 10px 20px max(10px,env(safe-area-inset-left,0px))}
.side-top{display:flex;align-items:center;gap:10px;padding:2px 4px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:.12em;line-height:1;padding:3px 9px;background:var(--steel);color:var(--steel-ink);border-radius:5px}
.side-proj{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:none;border:0;border-radius:8px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted);padding:0;flex:0 0 auto}
.icon-btn:hover{background:var(--sel)}
.icon-btn svg,.tab svg,.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:8px;text-align:left;padding:8px 10px;font-size:1rem;font-weight:500;color:var(--ink);min-height:46px}
.tab:hover{background:var(--sel)}
.tab[aria-current="page"]{background:var(--sel);font-weight:600}
.tab svg{color:var(--accent)}
.scrim{display:none}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;min-height:54px;
  padding:6px max(16px,env(safe-area-inset-right,0px)) 6px 16px}
#menuBtn{display:none}
.top-title{flex:1;min-width:0;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.wrap{width:100%;max-width:840px;margin:0 auto;padding:6px 32px 96px}
@media (min-width:900px){body.side-hidden .side{display:none}body.side-hidden #menuBtn{display:grid}}
@media (max-width:899px){
  .side{position:fixed;inset:0 auto 0 0;z-index:60;width:min(300px,86vw);height:100vh;height:100dvh;transform:translateX(-104%);visibility:hidden;
    transition:transform .2s ease,visibility 0s .2s;box-shadow:6px 0 24px rgba(0,0,0,.25);padding-top:max(14px,env(safe-area-inset-top,0px))}
  body.drawer .side{transform:none;visibility:visible;transition:transform .2s ease}
  body.drawer .scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.4)}
  #menuBtn{display:grid}#collapse{display:none}
  .wrap{padding:4px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}
  h1{font-size:2rem}
}

main{padding-top:14px;display:flex;flex-direction:column;gap:30px}
.page-head{display:flex;flex-direction:column;gap:6px}
.page-head p{margin:0;color:var(--muted);font-size:1.1rem}

/* cards and controls */
.card{display:flex;flex-direction:column;gap:12px;min-width:0}
.banner+.card,.actions+.card{margin-top:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1 1 160px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500;letter-spacing:.02em}
input[type=text],input[type=date],input[type=datetime-local],input[type=number],select,textarea{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink)}
textarea{resize:vertical;min-height:140px;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:10px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.round{border-radius:99px;padding:10px 20px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.steel{background:var(--steel);color:var(--steel-ink);border-color:var(--steel)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.small{min-height:36px;padding:6px 10px;font-size:.9rem}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.74rem;padding:3px 8px;border-radius:99px;border:1px solid var(--line);background:var(--raised);white-space:nowrap}
.pill.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.open{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.pill.tag{background:var(--steel);color:var(--steel-ink);border-color:transparent}
.banner{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:.92rem}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-weight:600;font-size:1.1rem}

/* checklist */
.check{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);min-height:48px}
.check:last-child{border-bottom:0}
.thead{display:flex;gap:12px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:.8rem;font-weight:500;color:var(--muted)}
.thead span:first-child{flex:0 0 40px}
.thead.r span:first-child{flex:0 0 calc(9ch + 10px)}
.box{flex:0 0 auto;width:26px;height:26px;border:2px solid var(--steel);border-radius:5px;background:var(--raised);display:grid;place-items:center;padding:0;color:transparent;font-weight:700}
.box[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.check .t{flex:1;min-width:0;overflow-wrap:anywhere;background:none;border:0;text-align:left;padding:6px 0}
.check.done .t{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;line-height:1;padding:8px;min-width:40px;min-height:40px}

/* place chips, dictation, photo markup */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:6px 14px;min-height:38px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);font-weight:600}
.btn.rec{background:var(--danger);border-color:var(--danger);color:#fff}
canvas.anno{max-width:100%;max-height:60vh;touch-action:none;border-radius:4px;background:#000}
.seg.dark{border-color:#6a7a76}
.seg.dark button{background:#222B29;color:#EAF0EE}
.seg.dark button[aria-pressed="true"]{background:#3F6B7A;box-shadow:inset 0 -3px 0 #F08A4B}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;padding:0}
.sw[aria-pressed="true"]{outline:3px solid #F08A4B;outline-offset:2px}

/* notes */
.dayt{font-size:1rem;font-weight:700;margin:14px 0 0}
.note{padding:12px 4px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.note[hidden]{display:none}
.note-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note-t{white-space:pre-wrap;overflow-wrap:anywhere}
.note-a{display:flex;gap:8px;align-items:center}
textarea.big{min-height:160px}

/* action row under the title */
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:-10px}
.actions .btn.primary{font-size:1.05rem}

/* collapsible days */
details.day{border-bottom:1px solid var(--line)}
details.day summary{display:flex;align-items:center;gap:12px;padding:12px 4px;min-height:52px;cursor:pointer;list-style:none;font-weight:600;font-size:1.1rem}
details.day summary::-webkit-details-marker{display:none}
details.day summary::before{content:"\25B8";color:var(--muted);transition:transform .12s}
details.day[open] summary::before{transform:rotate(90deg)}
details.day summary .pill{margin-left:auto}
.day-body{padding:0 4px 14px 30px;display:flex;flex-direction:column;gap:10px}

/* list rows */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.item .main b{display:block;overflow-wrap:anywhere}
.num{font-family:var(--f-mono);color:var(--muted);width:2ch;text-align:right}

/* gallery */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.shot{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.shot .ph{aspect-ratio:4/3;background:var(--line);border:0;padding:0;width:100%;display:block}
.shot .ph img{width:100%;height:100%;object-fit:cover;display:block}
.shot .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.shot .meta .d{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.shot .meta .n{overflow-wrap:anywhere;font-size:.92rem}
#lightbox{position:fixed;inset:0;z-index:40;background:rgba(10,14,13,.92);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#lightbox img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:4px}
#lightbox .cap{color:#EAF0EE;text-align:center;max-width:560px;overflow-wrap:anywhere}

/* home */
.hello{display:flex;flex-direction:column;gap:6px}
.hello .season{font-size:1.1rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-size:1.6rem;font-weight:500}
.stat span{font-size:.8rem;color:var(--muted)}
.sheet-note{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}

/* dew point, readings, hold points */
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.verdict{font-family:var(--f-mono);font-size:.88rem;padding:10px 12px;border-radius:5px;border:1px solid var(--line);background:var(--raised);overflow-wrap:anywhere}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.verdict.bad{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.read{display:flex;gap:10px;align-items:baseline;padding:9px 4px;border-bottom:1px solid var(--line);min-width:0}
.read:last-child{border-bottom:0}
.read .k{flex:0 0 auto;font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);min-width:9ch}
.read .v{flex:1;min-width:0;overflow-wrap:anywhere}
.hold{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);min-height:48px}
.hold:last-child{border-bottom:0}
.hold .t{flex:1;min-width:0;overflow-wrap:anywhere}
.hold.done .t{color:var(--muted)}
.hold .when{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);white-space:nowrap}

(function(){

}

function settings(){

/* ---------- toast / helpers ---------- */
var tt;

function arm(label,fn){

/* ---------- storage: IndexedDB on this phone ---------- */
var chains={},assets=null,dl=null,persistedState="bilinmiyor";
function setPersist(p){persist=p;var s=$("#sync");if(s)s.textContent=(p==="saved"?"telefonda kayıtlı":p==="saving"?"kaydediliyor":p==="error"?"kaydedilmedi":"loading")+(typeof syLabel==="function"?syLabel():"")}
function idbOpen(){
  return new Promise(function(res,rej){
    var r=indexedDB.open("efe-sitediary",2);
    r.onupgradeneeded=function(){var d=r.result;["docs","blobs","files"].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};
    r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
  });
}
function idbAll(store){
  return new Promise(function(res,rej){
    var out={},r=IDB.transaction(store).objectStore(store).openCursor();
    r.onsuccess=function(){var c=r.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};
    r.onerror=function(){rej(r.error)};
  });
}
function idbPut(store,key,val){
  return new Promise(function(res,rej){
    var tx=IDB.transaction(store,"readwrite");tx.objectStore(store).put(val,key);
    tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)};tx.onabort=function(){rej(tx.error)};
  });
}
function idbDel(store,key){
  return new Promise(function(res,rej){
    var tx=IDB.transaction(store,"readwrite");tx.objectStore(store).delete(key);
    tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)};tx.onabort=function(){rej(tx.error)};
  });
}
function idbGet(store,key){
  return new Promise(function(res){
    if(!IDB)return res(null);
    var r=IDB.transaction(store).objectStore(store).get(key);
    r.onsuccess=function(){res(r.result||null)};r.onerror=function(){res(null)};
  });
}
function save(id,data){
  docs[id]=data;scheduleRender();
  if(!IDB)return Promise.resolve();
  setPersist("saving");
  var p=(chains[id]||Promise.resolve()).then(function(){return idbPut("docs",id,JSON.parse(JSON.stringify(data)))})
    .then(function(){setPersist("saved");if(id!=="settings"&&id[0]!=="_")syncSoon()}).catch(function(e){setPersist("error");toast(errMsg(e))});
  chains[id]=p;return p;
}
function remove(id){
  delete docs[id];scheduleRender();
  if(!IDB)return Promise.resolve();
  var p=(chains[id]||Promise.resolve()).then(function(){return idbDel("docs",id)}).then(function(){if(id[0]!=="_")syncSoon()}).catch(function(e){toast(errMsg(e))});
  chains[id]=p;return p;
}
function storeBlob(id,b){blobs[id]=URL.createObjectURL(b);return IDB?idbPut("blobs",id,b):Promise.resolve()}
assets={
  upload:function(blob){
    var id="b_"+uid8();
    return storeBlob(id,blob).then(function(){return {id:id,url:blobs[id],sizeBytes:blob.size,contentType:blob.type}});
  },
  delete:function(id){
    var u=blobs[id];delete blobs[id];if(u){try{URL.revokeObjectURL(u)}catch(e){}}
    return (IDB?idbDel("blobs",id):Promise.resolve()).then(function(){return {deleted:true}});
  }
};
/* hand a file to the phone: share sheet first (Save to Files, AirDrop, mail), plain download as fallback */
async function saveFile(req){
  var blob=req.data instanceof Blob?req.data:new Blob([req.data]);
  var file=new File([blob],req.filename,{type:blob.type||"application/octet-stream"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:req.filename});return {status:"saved"}}
    catch(e){if(e&&e.name==="AbortError")throw {code:"declined"}}
  }
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=req.filename;a.style.display="none";
  document.body.append(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(a.href)},4000);
  return {status:"saved"};
}
dl={save:saveFile};
function saveSettings(patch){return save("settings",Object.assign({kind:"settings"},docs.settings||{},patch))}

/* ---------- logs ---------- */
var logId=function(date,pid){return "log_"+date+"_"+pid};
function blankLog(date,pid){
  return {kind:"log",date:date,projectId:pid,items:settings().checklist.map(function(t){return {t:t,done:false}}),notes:"",temp:"",weather:"",crew:"",
    toolbox:"",incident:"none",visitors:"",issues:"",readings:[],finished:false,finishedAt:null,updated:Date.now()};
}
function fullLog(date,pid){return Object.assign(blankLog(date,pid),docs[logId(date,pid)]||{})}
function editLog(date,pid,fn){
  var id=logId(date,pid),cur=JSON.parse(JSON.stringify(fullLog(date,pid)));
  fn(cur);cur.updated=Date.now();return save(id,cur);

var pending={},noteTimer=null;
function flush(){clearTimeout(noteTimer);var p=pending;pending={};Object.keys(p).forEach(function(k){p[k]()});}
function bindText(el,date,pid,field){
  el.addEventListener("input",function(){
    pending[field]=function(){if(el.value!==(fullLog(date,pid)[field]||""))editLog(date,pid,function(c){c[field]=el.value})};

/* dew point (Magnus formula) */
function dewPoint(t,rh){var g=Math.log(rh/100)+(17.62*t)/(243.12+t);return 243.12*g/(17.62-g)}
var calc={t:"",rh:"",s:"",m:"3"};

/* ---------- rendering ---------- */
var rq=0,deferred=false,forceNext=false;
function keepTyping(id){forceNext=true;setTimeout(function(){var n=document.getElementById(id);if(n)n.focus()},150)}
function isEditing(){var a=document.activeElement;return !!(a&&a.matches&&a.matches("#view textarea,#view input[type=text],#view input[type=number]"))}
function scheduleRender(){
  if(rq)return;
  rq=requestAnimationFrame(function(){rq=0;if(isEditing()&&!forceNext){deferred=true;return}forceNext=false;render()});
}

});

/* ---------- photos ---------- */
async function shrink(file){
  var MAX=1600;
  try{
    var bmp=await createImageBitmap(file);
    var sc=Math.min(1,MAX/Math.max(bmp.width,bmp.height));
    var c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    var b=await new Promise(function(r){c.toBlob(r,"image/jpeg",0.82)});
    if(b&&b.size) return b;
  }catch(e){}
  return file;
}
function uploadErr(e){
  var c=e&&e.code;
  if(c==="too_large") return "Bu fotoğraf çok büyük.";
  if(c==="unsupported_type") return "Bu dosya türü desteklenmiyor. JPG, PNG veya WebP kullan.";
  if(c==="quota_or_state") return "Fotoğraf depolaması dolu.";
  if(c==="rate_limited") return "Aynı anda çok fazla yükleme var. Biraz bekle.";
  return "Fotoğraf yüklenemedi.";
}
async function addPhotos(files,ctx){
  if(!assets){toast("Bu görünümde fotoğraf depolama kullanılamıyor.");return}
  var n=0;
  for(var i=0;i<files.length;i++){
    try{
      var blob=await shrink(files[i]);
      var type=blob.type||"image/jpeg";
      var r=await assets.upload(blob,{type:type});
      await save("ph_"+uid8(),{kind:"photo",asset:r.id,projectId:ctx.pid,date:ctx.date,note:ctx.note||"",tag:ctx.tag||"",ts:Date.now()});
      n++;
    }catch(e){toast(uploadErr(e))}
  }
  if(n)toast(n+(n>1?" fotoğraf":" fotoğraf")+" eklendi");
}
function pickPhotos(ctx,camera){
  var i=h("input",{type:"file",accept:"image/*",multiple:!camera,style:"display:none"});
  if(camera)i.setAttribute("capture","environment");
  document.body.append(i);
  i.addEventListener("change",function(){var f=[].slice.call(i.files);i.remove();if(f.length)addPhotos(f,typeof ctx==="function"?ctx():ctx)});
  i.click();
}

    var W=img.naturalWidth,H=img.naturalHeight,lw=Math.max(4,Math.round(Math.max(W,H)/190));
    var cv=h("canvas",{class:"anno"});cv.width=W;cv.height=H;
    var ctx=cv.getContext("2d"),strokes=[],cur=null,tool="pen",color="#E53935";
    function draw(){
      ctx.clearRect(0,0,W,H);ctx.drawImage(img,0,0,W,H);
      strokes.concat(cur?[cur]:[]).forEach(function(s){
        var pts=s.p,a=pts[0],b=pts[pts.length-1];
        ctx.strokeStyle=s.c;ctx.lineWidth=lw;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();
        if(s.t==="pen"){pts.forEach(function(q,i){i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])})}

          var ang=Math.atan2(b[1]-a[1],b[0]-a[0]),L=lw*6;
          ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
          ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-L*Math.cos(ang-0.45),b[1]-L*Math.sin(ang-0.45));
          ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-L*Math.cos(ang+0.45),b[1]-L*Math.sin(ang+0.45));
        }
        ctx.stroke();
      });
    }
    function pos(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
    cv.addEventListener("pointerdown",function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}cur={t:tool,c:color,p:[pos(e)]};draw()});
    cv.addEventListener("pointermove",function(e){if(cur){cur.p.push(pos(e));draw()}});
    function end(){if(cur){if(cur.p.length>1||cur.t==="pen")strokes.push(cur);cur=null;draw()}}

      var bt=h("button",{type:"button","aria-pressed":String(t[0]==="pen"),onclick:function(){setTool(t[0])}},t[1]);toolBtns.push([t[0],bt]);return bt}));
    var colRow=h("div",{class:"row",style:"gap:8px"},[["#E53935","Kırmızı"],["#FDD835","Sarı"],["#1E88E5","Mavi"]].map(function(c){
      var bt=h("button",{type:"button",class:"sw","aria-label":c[1],"aria-pressed":String(c[0]===color),style:"background:"+c[0],onclick:function(){setColor(c[0])}});colBtns.push([c[0],bt]);return bt}));

        h("button",{class:"btn",type:"button",onclick:function(){strokes=[];draw()}},"Temizle"),
        h("button",{class:"btn primary",type:"button",onclick:function(){

var SY={busy:false,again:false,timer:null,applying:false,last:0,err:"",live:false};

var SYF={projects:["name","address","archived"],notes:["date","time","project","where","text"],reminders:["project","text","due","done"],schedule:["project","text","date","time","done"],holds:["project","text","done","date"],places:["project","text"],photos:["date","project","note","tag","url"]};
function syCfg(){var c=docs._cfg;return c&&c.url&&c.key?c:null}

function syQuiet(id,data){docs[id]=data;return IDB?idbPut("docs",id,JSON.parse(JSON.stringify(data))).catch(function(){}):Promise.resolve()}

  var s=JSON.stringify(SYF[t].map(function(f){return rec[f]})),x=5381;
  for(var i=0;i<s.length;i++)x=((x*33)^s.charCodeAt(i))>>>0;

function syFlatten(){
  var out={projects:{},notes:{},reminders:{},schedule:{},holds:{},places:{},photos:{}},m=syMeta();
  var nm=function(pid){return docs[pid]&&docs[pid].name?syS(docs[pid].name):""};
  Object.keys(docs).forEach(function(id){

      schedOf(d).forEach(function(x){if(x.i)out.schedule[x.i]={project:pn,text:syS(x.t),date:syS(x.date),time:syS(x.time),done:!!x.done}});
      holdsOf(d).forEach(function(x){if(x.i)out.holds[x.i]={project:pn,text:syS(x.t),done:!!x.done,date:syS(x.date)}});
      placesOf(d).forEach(function(t){out.places[syPlaceId(id,t,m)]={project:pn,text:syS(t)}});

async function syEnsureIds(){

    if(d.holds)nd.holds=d.holds.map(function(x){return x.i?x:Object.assign({},x,{i:"h_"+uid8()+Math.random().toString(36).slice(2,5)})});

function syProjId(name){

  var ps=projects();
  if(name){
    var low=name.toLowerCase(),hit=ps.filter(function(p){return syS(p.name).toLowerCase()===low})[0];
    if(hit)return hit.id;
    var id="proj_"+uid8()+Math.random().toString(36).slice(2,4);
    save(id,{kind:"project",name:name,address:"",created:Date.now(),archived:false});
    return id;
  }
  var ap=activeProject();return ap?ap.id:null;
}
function syFindItem(key,id){
  var ps=projects();
  for(var i=0;i<ps.length;i++){
    var l=Array.isArray(docs[ps[i].id][key])?docs[ps[i].id][key]:[];
    for(var j=0;j<l.length;j++)if(l[j].i===id)return {pid:ps[i].id,idx:j};
  }
  return null;
}
function syPutItem(key,pid,id,item){
  var f=syFindItem(key,id);
  if(f&&f.pid!==pid){
    var o=docs[f.pid],ol=o[key].filter(function(x){return x.i!==id});
    save(f.pid,Object.assign({},o,(function(){var z={};z[key]=ol;return z})()));
  }
  var p=docs[pid],l=Array.isArray(p[key])?p[key].slice():[],ix=-1;
  l.forEach(function(x,j){if(x.i===id)ix=j});
  if(ix>=0)l[ix]=Object.assign({},l[ix],item);else l.push(item);
  var z={};z[key]=l;save(pid,Object.assign({},p,z));
}
function syApply(t,id,r){
  var d=docs[id];
  if(t==="projects"){
    save(id,Object.assign({created:Date.now(),places:[],holds:[],reminders:[]},d||{},{kind:"project",name:r.name||(d&&d.name)||"Proje",address:r.address,archived:!!r.archived}));
  }else if(t==="notes"){
    var pid=syProjId(r.project);if(!pid||!/^\d{4}-\d\d-\d\d$/.test(r.date))return;
    var ts=d&&d.ts&&d.date===r.date&&syHM(d.ts)===(r.time||"00:00")?d.ts:new Date(r.date+"T"+(r.time||"00:00")+":00").getTime();
    if(isNaN(ts))return;
    save(id,Object.assign({},d||{},{kind:"note",projectId:pid,date:r.date,ts:ts,created:(d&&d.created)||Date.now(),where:r.where,text:r.text}));
  }else if(t==="reminders"){
    var p1=syProjId(r.project);if(!p1||!r.text)return;
    var o1=syFindItem("reminders",id),old=o1?docs[o1.pid].reminders[o1.idx]:null;
    syPutItem("reminders",p1,id,{i:id,t:r.text,due:r.due,done:!!r.done,created:(old&&old.created)||Date.now()});
  }else if(t==="schedule"){
    var p4=syProjId(r.project);if(!p4||!r.text||!/^\d{4}-\d\d-\d\d$/.test(r.date))return;
    var o4=syFindItem("schedule",id),old4=o4?docs[o4.pid].schedule[o4.idx]:null;
    syPutItem("schedule",p4,id,{i:id,t:r.text,date:r.date,time:r.time,done:!!r.done,created:(old4&&old4.created)||Date.now()});
  }else if(t==="holds"){
    var p2=syProjId(r.project);if(!p2||!r.text)return;
    syPutItem("holds",p2,id,{i:id,t:r.text,done:!!r.done,date:r.date||null});
  }else if(t==="places"){
    var p3=syProjId(r.project);if(!p3||!r.text)return;
    var m=syMeta(),list=placesOf(docs[p3]).slice(),oldT=null;
    list.forEach(function(x){if(syPlaceId(p3,x,m)===id)oldT=x});
    if(oldT!==null&&oldT!==r.text){list=list.map(function(x){return x===oldT?r.text:x});delete m.placeIds[p3+"|"+oldT]}
    else if(list.indexOf(r.text)<0)list.push(r.text);
    m.placeIds[p3+"|"+r.text]=id;
    docs._meta=Object.assign({},docs._meta||{},{placeIds:m.placeIds});
    save(p3,Object.assign({},docs[p3],{places:list}));
  }else if(t==="photos"){
    if(!d)return;
    save(id,Object.assign({},d,{date:r.date||d.date,note:r.note,tag:r.tag,url:r.url||d.url}));
  }
}
function syDelete(t,id){
  if(t==="projects")return;
  if(t==="notes"){if(docs[id])remove(id)}
  else if(t==="reminders"||t==="holds"||t==="schedule"){
    var key=t,f=syFindItem(key,id);if(!f)return;
    var o=docs[f.pid],z={};z[key]=o[key].filter(function(x){return x.i!==id});save(f.pid,Object.assign({},o,z));
  }else if(t==="places"){
    var ps=projects(),m=syMeta();
    ps.forEach(function(p){
      placesOf(p).forEach(function(x){if(syPlaceId(p.id,x,m)===id)save(p.id,Object.assign({},docs[p.id],{places:placesOf(docs[p.id]).filter(function(y){return y!==x})}))});
    });
  }else if(t==="photos"){
    var d=docs[id];if(d){remove(id);if(d.asset)assets.delete(d.asset)}
  }
}

async function syncNow(){
  var cfg=syCfg();if(!cfg||!IDB&&false)return;
  if(SY.busy){SY.again=true;return}
  SY.busy=true;SY.err="";syPaint();
  try{
    await syEnsureIds();
    await syUploadPhotos(cfg);
    var known=syMeta().known,loc=syFlatten(),req={action:"sync",ops:{}};
    SYT.forEach(function(t){
      var kt=known[t]||{},up=[],rm=[];
      Object.keys(loc[t]).forEach(function(id){if(kt[id]!==syHash(t,loc[t][id]))up.push(Object.assign({id:id},loc[t][id]))});
      Object.keys(kt).forEach(function(id){if(!(id in loc[t]))rm.push(id)});
      req.ops[t]={upsert:up,remove:rm};
    });
    var res=await syPost(cfg,req);
    if(!res.ok)throw new Error(res.error||"bilinmeyen");
    var dels=[],apps=[];
    SYT.forEach(function(t){
      var remote={};(res.state[t]||[]).forEach(function(r){remote[r.id]=r});
      var del={};((res.deleted&&res.deleted[t])||[]).forEach(function(id){del[id]=1});
      var kt=known[t]||{},lt=loc[t],empty=!Object.keys(remote).length;
      Object.keys(lt).forEach(function(id){
        if(remote[id])return;
        if(del[id]||(id in kt&&!empty))dels.push([t,id]);
      });
      Object.keys(remote).forEach(function(id){
        var r=remote[id];
        if(!(id in lt)){if(!(id in kt))apps.push([t,id,r]);return}
        if(syHash(t,r)!==syHash(t,lt[id])&&kt[id]===syHash(t,lt[id]))apps.push([t,id,r]);
      });
    });
    SY.applying=true;
    try{
      apps.sort(function(a,b){return SYT.indexOf(a[0])-SYT.indexOf(b[0])});
      apps.forEach(function(x){syApply(x[0],x[1],x[2])});
      dels.forEach(function(x){syDelete(x[0],x[1])});
    }finally{SY.applying=false}
    var fin=syFlatten(),nk={};
    SYT.forEach(function(t){
      nk[t]={};
      var inRemote={};(res.state[t]||[]).forEach(function(r){inRemote[r.id]=1});
      Object.keys(fin[t]).forEach(function(id){if(inRemote[id])nk[t][id]=syHash(t,fin[t][id])});
    });
    await syQuiet("_meta",Object.assign({},docs._meta||{},{known:nk,placeIds:syMeta().placeIds,at:Date.now()}));
    SY.last=Date.now();SY.err="";
  }catch(e){SY.err=syErrText(e)}
  SY.busy=false;syPaint();
  if(SY.again){SY.again=false;if(!SY.err)syncSoon(500)}
}
function syncSoon(ms){
  if(!syCfg()||SY.applying)return;
  clearTimeout(SY.timer);SY.timer=setTimeout(syncNow,ms||2500);
}
function syInit(){
  if(SY.live)return;SY.live=true;
  document.addEventListener("visibilitychange",function(){if(!document.hidden)syncNow()});
  window.addEventListener("online",function(){syncNow()});
  setInterval(function(){if(!document.hidden)syncNow()},60000);
  syncNow();
}

function dewCard(onAdd){
  var num=function(id,v,step){return h("input",{type:"number",id:id,inputmode:"decimal",step:step,value:v})};
  var t=num("dp-t",calc.t,"0.1"),rh=num("dp-rh",calc.rh,"1"),s=num("dp-s",calc.s,"0.1"),m=num("dp-m",calc.m,"0.5");
  var res=h("div",{class:"verdict",text:"Enter air temperature and humidity."}),last=null;
  function upd(){
    calc.t=t.value;calc.rh=rh.value;calc.s=s.value;calc.m=m.value;last=null;
    var T=parseFloat(t.value),RH=parseFloat(rh.value),S=parseFloat(s.value),M=parseFloat(m.value);
    if(isNaN(M))M=3;

    var d=dewPoint(T,RH),p=["Air "+T+" °C","RH "+RH+" %"];

    }

  upd();

    h("h3",{text:"Dew point check"}),

    h("div",{class:"calc"},

    h("div",{class:"row"},h("button",{class:"btn small",type:"button",onclick:function(){if(!last){toast("Enter air temperature and humidity first.");return}onAdd(last)}},"Add result to measurements")));

function syFlatten(){
  var out={projects:{},notes:{},reminders:{},schedule:{},holds:{},places:{},photos:{}},m=syMeta();

      placesOf(d).forEach(function(t){out.places[syPlaceId(id,t,m)]={project:pn,text:syS(t)}});

function syFindItem(key,id){
  var ps=projects();
  for(var i=0;i<ps.length;i++){
    var l=Array.isArray(docs[ps[i].id][key])?docs[ps[i].id][key]:[];
    for(var j=0;j<l.length;j++)if(l[j].i===id)return {pid:ps[i].id,idx:j};

function syPutItem(key,pid,id,item){

  }
  var p=docs[pid],l=Array.isArray(p[key])?p[key].slice():[],ix=-1;
  l.forEach(function(x,j){if(x.i===id)ix=j});
  if(ix>=0)l[ix]=Object.assign({},l[ix],item);else l.push(item);

function syApply(t,id,r){
  var d=docs[id];
  if(t==="projects"){
    save(id,Object.assign({created:Date.now(),places:[],holds:[],reminders:[]},d||{},{kind:"project",name:r.name||(d&&d.name)||"Project",address:r.address,archived:!!r.archived}));

async function syncNow(){

      Object.keys(kt).forEach(function(id){if(!(id in loc[t]))rm.push(id)});
      req.ops[t]={upsert:up,remove:rm};
    });
    var res=await syPost(cfg,req);
    if(!res.ok)throw new Error(res.error||"bilinmeyen");
    var dels=[],apps=[];
    SYT.forEach(function(t){
      var remote={};(res.state[t]||[]).forEach(function(r){remote[r.id]=r});
      var del={};((res.deleted&&res.deleted[t])||[]).forEach(function(id){del[id]=1});
      var kt=known[t]||{},lt=loc[t],empty=!Object.keys(remote).length;
      Object.keys(lt).forEach(function(id){
        if(remote[id])return;
        if(del[id]||(id in kt&&!empty))dels.push([t,id]);
      });
      Object.keys(remote).forEach(function(id){
        var r=remote[id];
        if(!(id in lt)){if(!(id in kt))apps.push([t,id,r]);return}
        if(syHash(t,r)!==syHash(t,lt[id])&&kt[id]===syHash(t,lt[id]))apps.push([t,id,r]);
      });
    });
    SY.applying=true;
    try{
      apps.sort(function(a,b){return SYT.indexOf(a[0])-SYT.indexOf(b[0])});
      apps.forEach(function(x){syApply(x[0],x[1],x[2])});
      dels.forEach(function(x){syDelete(x[0],x[1])});
    }finally{SY.applying=false}
    var fin=syFlatten(),nk={};
    SYT.forEach(function(t){
      nk[t]={};
      var inRemote={};(res.state[t]||[]).forEach(function(r){inRemote[r.id]=1});
      Object.keys(fin[t]).forEach(function(id){if(inRemote[id])nk[t][id]=syHash(t,fin[t][id])});
    });
    await syQuiet("_meta",Object.assign({},docs._meta||{},{known:nk,placeIds:syMeta().placeIds,at:Date.now()}));
    SY.last=Date.now();SY.err="";
  }catch(e){SY.err=syErrText(e)}
  SY.busy=false;syPaint();
  if(SY.again){SY.again=false;if(!SY.err)syncSoon(500)}
}
function syncSoon(ms){
  if(!syCfg()||SY.applying)return;
  clearTimeout(SY.timer);SY.timer=setTimeout(syncNow,ms||2500);
}
function syInit(){
  if(SY.live)return;SY.live=true;
  document.addEventListener("visibilitychange",function(){if(!document.hidden)syncNow()});
  window.addEventListener("online",function(){syncNow()});
  setInterval(function(){if(!document.hidden)syncNow()},60000);
  syncNow();
}

function sheetCard(){
  var cfg=syCfg();
  var urlIn=h("input",{type:"url",id:"sy-url",placeholder:"https://script.google.com/macros/s/…/exec","aria-label":"Connection address",value:cfg?cfg.url:"",autocapitalize:"off",autocomplete:"off"});
  var keyIn=h("input",{type:"password",id:"sy-key",placeholder:"Key","aria-label":"Key",value:cfg?cfg.key:"",autocapitalize:"off",autocomplete:"off"});
  var last=SY.last||(docs._meta&&docs._meta.at)||0;
  var st=!cfg?"Not connected.":SY.busy?"Syncing…":SY.err?SY.err:"Connected. Last sync: "+(last?syP2(new Date(last).getHours())+":"+syP2(new Date(last).getMinutes()):"none yet");
  async function connect(){
    var u=urlIn.value.trim(),k=keyIn.value.trim();
    if(!/^https:\/\/script\.google\.com\//.test(u)||!k){toast("Paste the address and the key.");return}
    toast("Connecting…");
    try{
      var r=await syPost({url:u,key:k},{action:"ping"});
      if(!r.ok)throw new Error(r.error||"bilinmeyen");
      await syQuiet("_cfg",{url:u,key:k});SY.err="";
      toast("Connected. Running the first sync…");syPaint();syncNow();
    }catch(e){toast(syErrText(e))}
  }
  return h("div",{class:"card"},h("h3",{text:"Google Sheet connection"}),
    h("p",{class:"muted small",style:"margin:0",text:"Once connected, your notes, reminders, schedule and hold points are written to your Google Sheet, and rows you add or fix in the Sheet come back into the app. Photos are uploaded to the EFE folder in your Drive. The address and key stay on this phone only."}),
    h("div",{class:"mono small",text:st}),
    h("label",{class:"f","for":"sy-url"},"Connection address",urlIn),
    h("label",{class:"f","for":"sy-key"},"Key",keyIn),
    h("div",{class:"row"},
      h("button",{class:"btn primary",type:"button",onclick:connect},cfg?"Update and connect":"Connect"),
      cfg?h("button",{class:"btn",type:"button",onclick:function(){syncNow();toast("Syncing…")}},"Sync now"):null,
      cfg?arm("Disconnect",function(){delete docs._cfg;delete docs._meta;if(IDB){idbDel("docs","_cfg");idbDel("docs","_meta")}SY.err="";SY.last=0;syPaint();toast("Disconnected. Your data is still on this phone.")}):null));
}

/* ---------- downloads: build the file, then save from a fresh tap ---------- */
async function doDownload(kind){
  var list=filteredLogs();
  if(!list.length){toast("Nothing to export in this range.");return}
  var r=exportRange(),base="sitediary_"+r.from+"_to_"+r.to;
  try{
    if(kind==="csv"){
      var b=new Blob([buildCsv(list)],{type:"text/csv"});
      readyFile={filename:base+".csv",data:b,size:b.size,kind:"export",note:""};
    }else{
      if(expState.photos)toast("Preparing the report with photos…");
      var rep=await buildReport(list,expState.photos);
      var hb=new Blob([rep.html],{type:"text/html"});
      readyFile={filename:base+".html",data:hb,size:hb.size,kind:"export",note:expState.photos?rep.included+(rep.included===1?" photo included":" photos included"):""};
    }
    render();
  }catch(e){toast("Could not build the file.")}
}
function readyBar(){
  if(!readyFile)return null;
  var f=readyFile;
  return h("div",{class:"card"},
    h("h3",{text:"File ready"}),
    h("div",{class:"mono small",text:f.filename+" · "+Math.max(1,Math.round(f.size/1024))+" KB"}),
    f.note?h("div",{class:"small muted",text:f.note}):null,
    h("div",{class:"row"},
      h("button",{class:"btn primary",type:"button",onclick:function(){
        saveFile(f).then(function(){
          readyFile=null;toast("File saved.");
          if(f.kind==="backup")saveSettings({lastBackup:Date.now()});else render();
        }).catch(function(e){if(e&&e.code==="declined")return;toast("Could not save the file.")});
      }},"Save or share file"),
      h("button",{class:"btn ghost",type:"button",onclick:function(){readyFile=null;render()}},"Dismiss")));
}

/* ---------- backup and restore ---------- */
function blobToDataURL(b){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=function(){res(null)};fr.readAsDataURL(b)})}
async function makeBackup(withPhotos){
  toast(withPhotos?"Preparing backup with photos…":"Preparing backup…");
  var out={app:"efe-sitediary",version:1,created:new Date().toISOString(),docs:syBackupDocs(),photos:[]};
  if(withPhotos){
    var ids=allPhotos().map(function(p){return p.asset});
    for(var i=0;i<ids.length;i++){
      var b=await idbGet("blobs",ids[i]);
      var d=b?await blobToDataURL(b):null;
      if(d)out.photos.push({id:ids[i],data:d});
    }
  }
  var blob=new Blob([JSON.stringify(out)],{type:"text/plain"});
  readyFile={filename:"efe-backup-"+today()+(withPhotos?"-with-photos":"")+".json",data:blob,size:blob.size,kind:"backup",note:withPhotos?out.photos.length+" photos included":"Entries only, no photos"};
  render();
}
function pickRestore(){
  var i=h("input",{type:"file",accept:"application/json,.json,text/plain",style:"display:none"});
  document.body.append(i);
  i.addEventListener("change",async function(){
    var f=i.files[0];i.remove();if(!f)return;
    try{
      var j=JSON.parse(await f.text());
      if(!j||j.app!=="efe-sitediary"||!j.docs)throw new Error("not a backup");
      var n=0,p=0,ids=Object.keys(j.docs);
      for(var a=0;a<ids.length;a++){await save(ids[a],j.docs[ids[a]]);n++}
      var ph=j.photos||[];
      for(var k=0;k<ph.length;k++){var r=await fetch(ph[k].data);await storeBlob(ph[k].id,await r.blob());p++}
      render();toast("Restored "+n+" entries and "+p+" photos.");
    }catch(e){toast("That file is not an EFE backup.")}
  });
  i.click();
}
function storageCard(){
  var last=settings().lastBackup;
  return h("div",{class:"card"},h("h3",{text:"Storage and backup"}),
    h("p",{class:"muted small",style:"margin:0",text:"Entries and photos are stored on this phone only. If you clear the browser data, delete the app or lose the phone, they are gone. Back up often."}),
    h("div",{class:"mono small",text:allLogs().length+" diary days · "+allPhotos().length+" photos · last backup: "+(last?fmt(ymd(new Date(last))):"never")}),
    h("div",{class:"mono small muted",text:"Protected storage: "+persistedState}),
    h("div",{class:"row"},
      h("button",{class:"btn primary",type:"button",onclick:function(){makeBackup(false)}},"Back up (no photos)"),
      h("button",{class:"btn",type:"button",onclick:function(){makeBackup(true)}},"Back up with photos"),
      h("button",{class:"btn ghost",type:"button",onclick:pickRestore},"Restore from file")));
}
function installCard(){
  var standalone=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
  if(standalone)return null;
  return h("div",{class:"card"},h("h3",{text:"Install on your phone"}),
    h("div",{class:"small",text:"iPhone: open this page in Safari, tap Share, then Add to Home Screen."}),
    h("div",{class:"small",text:"Android: open it in Chrome, tap the menu, then Install app."}),
    installEvt?h("div",{class:"row"},h("button",{class:"btn primary",type:"button",onclick:function(){installEvt.prompt();installEvt=null;render()}},"Install app")):null);
}

/* ---------- boot ---------- */
async function boot(){
  buildTabs();render();
  try{
    IDB=await idbOpen();
    docs=await idbAll("docs");
    var bl=await idbAll("blobs");
    Object.keys(bl).forEach(function(k){blobs[k]=URL.createObjectURL(bl[k])});
    setPersist("saved");
  }catch(e){
    IDB=null;setPersist("error");
    toast("This browser cannot store data. Entries are lost when you close the app.");
  }
  render();
  try{
    if(navigator.storage&&navigator.storage.persist){
      var ok=await navigator.storage.persist();persistedState=ok?"yes":"no";
    }
  }catch(e){}
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();installEvt=e;if(tab==="options")render()});
  syInit();if(window.__EFE_TEST)window.__EFE_TEST.api={sync:syncNow,sy:SY,addPhotos:addPhotos,makeBackup:makeBackup,docs:function(){return docs},blobs:function(){return blobs},ready:function(){return readyFile}};
}
boot();
})();
